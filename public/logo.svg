<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd980"/>
      <stop offset="0.55" stop-color="#f0b429"/>
      <stop offset="1" stop-color="#c07d10"/>
    </linearGradient>
    <linearGradient id="goldTower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8a93d"/>
      <stop offset="1" stop-color="#a06709"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7e0"/>
      <stop offset="1" stop-color="#f0d99e"/>
    </linearGradient>
  </defs>

  <!-- capa do livro -->
  <path d="M12 92 Q38 82 60 93 Q82 82 108 92 L101 107 Q78 100 60 109 Q42 100 19 107 Z" fill="#8a2f1d"/>
  <!-- páginas do livro -->
  <path d="M17 90 Q40 79 60 90 Q80 79 103 90 L98 101 Q78 92 60 101 Q42 92 22 101 Z" fill="url(#page)" stroke="#a8721c" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M60 90 L60 101" stroke="#c9a24a" stroke-width="2"/>

  <!-- torre esquerda -->
  <g stroke="#7c4a08" stroke-width="2" stroke-linejoin="round">
    <rect x="26" y="54" width="15" height="34" fill="url(#goldTower)"/>
    <rect x="26" y="48" width="4.5" height="7" fill="url(#gold)"/>
    <rect x="31.7" y="48" width="4.5" height="7" fill="url(#gold)"/>
    <rect x="37.4" y="48" width="4.5" height="7" fill="url(#gold)"/>
  </g>
  <line x1="33.5" y1="48" x2="33.5" y2="37" stroke="#6b4410" stroke-width="2"/>
  <path d="M33.5 37 L45 40.5 L33.5 44 Z" fill="#d93636" stroke="#a01f1f" stroke-width="1"/>

  <!-- torre direita -->
  <g stroke="#7c4a08" stroke-width="2" stroke-linejoin="round">
    <rect x="79" y="54" width="15" height="34" fill="url(#goldTower)"/>
    <rect x="79" y="48" width="4.5" height="7" fill="url(#gold)"/>
    <rect x="84.7" y="48" width="4.5" height="7" fill="url(#gold)"/>
    <rect x="90.4" y="48" width="4.5" height="7" fill="url(#gold)"/>
  </g>
  <line x1="86.5" y1="48" x2="86.5" y2="37" stroke="#6b4410" stroke-width="2"/>
  <path d="M86.5 37 L98 40.5 L86.5 44 Z" fill="#d93636" stroke="#a01f1f" stroke-width="1"/>

  <!-- torre central -->
  <g stroke="#7c4a08" stroke-width="2" stroke-linejoin="round">
    <rect x="42" y="44" width="36" height="44" fill="url(#gold)"/>
    <rect x="42" y="37" width="5.5" height="8" fill="url(#gold)"/>
    <rect x="50.5" y="37" width="5.5" height="8" fill="url(#gold)"/>
    <rect x="59" y="37" width="5.5" height="8" fill="url(#gold)"/>
    <rect x="67.5" y="37" width="5.5" height="8" fill="url(#gold)"/>
    <rect x="76" y="37" width="5.5" height="8" fill="url(#gold)"/>
  </g>
  <line x1="60" y1="37" x2="60" y2="22" stroke="#6b4410" stroke-width="2.5"/>
  <path d="M60 22 L77 26.5 L60 31 Z" fill="#d93636" stroke="#a01f1f" stroke-width="1"/>

  <!-- porta e janelas -->
  <path d="M54 88 v-11 a6 6 0 0 1 12 0 v11 Z" fill="#6b4410"/>
  <rect x="48" y="56" width="5" height="8" rx="2" fill="#6b4410"/>
  <rect x="67" y="56" width="5" height="8" rx="2" fill="#6b4410"/>
</svg>
